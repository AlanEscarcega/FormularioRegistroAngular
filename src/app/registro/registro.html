<div class="formulario">
    <h2>Registro de usuario</h2>

    <form #registroForm="ngForm" (ngSubmit)="registrar()">

        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" name="nombre" [(ngModel)]="usuario.nombre" required>

        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" name="correo" [(ngModel)]="usuario.correo" required>

        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" name="telefono" [(ngModel)]="usuario.telefono" required>

        <label for="edad">Edad</label>
        <input id="edad" type="number" name="edad" [(ngModel)]="usuario.edad" required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" name="contrasena" [(ngModel)]="usuario.contrasena" required>

        <label for="confirmacion">Confirmación de contraseña</label>
        <input id="confirmacion" type="password" name="confirmacion" [(ngModel)]="usuario.confirmacion" required>

        <button type="submit" [disabled]="registroForm.invalid">
            Registrar
        </button>

    </form>

    @if (registrado) {
    <div class="resultado">
        <h3>Datos registrados</h3>
        <p><strong>Nombre:</strong> {{ usuario.nombre }}</p>
        <p><strong>Correo:</strong> {{ usuario.correo }}</p>
        <p><strong>Teléfono:</strong> {{ usuario.telefono }}</p>
        <p><strong>Edad:</strong> {{ usuario.edad }}</p>
        <p><strong>Contraseña:</strong> {{ usuario.contrasena }}</p>
        <p><strong>Confirmación:</strong> {{ usuario.confirmacion }}</p>
    </div>
    }

</div>
